services:
  project_t_mysql:
    image: mysql:8.4
    container_name: project_t_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: project_t_db
    ports:
      - "3307:3306"
    volumes:
      - project_t_mysql_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  project_t_mysql_data:
