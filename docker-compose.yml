services:
  project_t_mysql:
    image: mysql:8.4
    container_name: project_t_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: project_t_db
    ports:
      - "3307:3306"
    volumes:
      - project_t_mysql_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql

  project_t_backend:
    build: ./backend
    container_name: project_t_backend
    restart: unless-stopped
    environment:
      PORT: 5001
      DB_HOST: project_t_mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 1234
      DB_NAME: project_t_db
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - project_t_mysql

  project_t_frontend:
    build: ./frontend
    container_name: project_t_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - project_t_backend

volumes:
  project_t_mysql_data:
